<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Komodo Wellbeing Hub · Named</title>
<style>
:root{--g:#1B5E3A;--g2:#2E7D52;--gold:#C9A227;--goldsoft:#FBF3DC;--red:#B03A2E;--redsoft:#F7E1DE;--tint:#EEF3EF;--bg:#F4F6F5;--ink:#1F2A24;--muted:#5E6B63;--line:#DDE3DF;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Arial,Helvetica,sans-serif}
header{background:var(--g);color:#fff;padding:18px 20px 14px}
.hwrap,.wrap{max-width:1180px;margin:0 auto}
header h1{margin:0;font-size:24px;letter-spacing:.2px}
header .sub{opacity:.9;font-size:14px;margin-top:2px}
.badge{display:inline-block;background:var(--gold);color:var(--g);font-weight:700;font-size:12px;border-radius:999px;padding:3px 10px;margin-left:8px;vertical-align:middle}
.hrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
select,input{font:inherit;font-size:14px;border-radius:8px;border:1px solid #cfd8d3;padding:7px 10px;min-width:0}
select{max-width:100%}
input{width:240px;max-width:100%}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.04)}
nav .wrap{display:flex;gap:2px;overflow-x:auto;padding:0 12px;scrollbar-width:thin}
nav button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px 9px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--g);border-bottom-color:var(--gold);font-weight:700}
main{padding:18px 16px 30px}
.panel{display:none}.panel.on{display:block}
h2{color:var(--g);font-size:20px;margin:4px 0 12px}
h3{color:var(--g);font-size:16px;margin:0 0 10px}
.grid{display:grid;gap:12px}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi{border-radius:12px;padding:14px 16px;background:var(--tint)}
.kpi .v{font-size:30px;font-weight:800;color:var(--g);line-height:1.1}
.kpi .l{font-size:13px;color:var(--ink);margin-top:4px}
.kpi.gold{background:var(--goldsoft)}.kpi.gold .v{color:#8A6A0F}
.kpi.red{background:var(--redsoft)}.kpi.red .v{color:var(--red)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.pill.ok{background:#E3EFE6;color:var(--g)}.pill.part{background:var(--goldsoft);color:#8A6A0F}.pill.bad{background:var(--redsoft);color:var(--red)}
ul.f{margin:0;padding-left:20px}ul.f li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--g);color:#fff;text-align:left;font-weight:600;padding:8px 10px}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.low td{background:var(--goldsoft)}
.tw{overflow-x:auto}
.bars .row{display:grid;grid-template-columns:70px 1fr 48px;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.bars .track{background:#EEF1EF;border-radius:6px;height:18px;position:relative;overflow:hidden}
.bars .fill{height:100%;background:#9DB5A6;border-radius:6px}
.bars .fill.lowest{background:var(--gold)}
.bars .fill.unrel{background:repeating-linear-gradient(45deg,#cfd6d2 0 6px,#e6ebe8 6px 12px)}
.bars .avg{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--g)}
.bars .val{font-weight:700;text-align:right}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 2fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.muted{color:var(--muted)}.small{font-size:13px}
.note{background:var(--tint);border-left:4px solid var(--g);padding:10px 12px;border-radius:8px;font-size:14px}
.res{margin-top:12px}
.res .card{border-left:4px solid var(--gold)}
.chip{display:inline-block;background:var(--tint);color:var(--g);border-radius:999px;padding:2px 9px;margin:2px 4px 2px 0;font-size:12px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px;border-top:1px solid var(--line);background:#fff}
.printhead{display:none}
@media (max-width:820px){.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.k3,.k2{grid-template-columns:1fr}}
@media (max-width:480px){header h1{font-size:20px}.kpi .v{font-size:24px}input{width:100%}.controls{width:100%}.controls>*{flex:1 1 100%}.bars .row{grid-template-columns:56px 1fr 40px}table{font-size:13px}}
@media print{
 @page{size:A4 landscape;margin:12mm}
 body{background:#fff;font-size:12px}
 nav,.controls,#searchRes{display:none!important}
 header{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .panel{display:block!important;break-before:page}
 .panel:first-of-type{break-before:auto}
 .card,.kpi,tr{break-inside:avoid}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 footer{display:none}
}

.badge.conf{background:#B03A2E;color:#fff}
.sfil{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 8px}
.sfil select,.sfil input{flex:0 1 auto}
.sfil input{width:260px}
.scount{font-size:13px;color:var(--muted);margin:4px 0 8px}
table.st td{vertical-align:middle}
table.st tr.srow{cursor:pointer}
table.st tr.srow:hover td{background:#F7FAF8}
table.st tr.srow:focus-visible td{outline:2px solid var(--gold);outline-offset:-2px}
.sname{font-weight:700}
.sid{font-size:12px;color:var(--muted)}
.ace{display:inline-block;background:#E6EEF8;color:#2B4C7E;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:4px;vertical-align:1px}
.fl{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:700;margin:1px 3px 1px 0;white-space:nowrap}
.fl.urgent{background:var(--redsoft);color:var(--red)}
.fl.watch{background:var(--goldsoft);color:#8A6A0F}
.fl.drop{background:#F3E3E0;color:#8E2F25;border:1px dashed #C77C72}
.fl.rise{background:#E3EFE6;color:var(--g)}
.fl.safety{background:#3B1F1C;color:#fff}
.fl.request{background:#E6EEF8;color:#2B4C7E}
.fl.concern{background:#EFE6F5;color:#5B3B7A}
.sc{font-weight:800;font-variant-numeric:tabular-nums}
.sc.u{color:var(--red)}.sc.w{color:#8A6A0F}
.tr{white-space:nowrap;font-size:12.5px;font-variant-numeric:tabular-nums}
.tr .pt{display:inline-block;background:var(--tint);border-radius:6px;padding:1px 6px;margin-right:2px}
.tr .pt small{color:var(--muted);margin-right:3px}
.tr .ar{font-weight:800;margin:0 2px}
.ar.dn{color:var(--red)}.ar.up{color:var(--g2)}.ar.eq{color:var(--muted)}
.low{font-size:12.5px}
tr.sdet td{background:#FAFBFA;padding:10px 14px 14px}
.dgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.dgrid h4{margin:0 0 6px;color:var(--g);font-size:13px}
.mb{display:grid;grid-template-columns:minmax(0,1fr) 110px 40px;gap:8px;align-items:center;font-size:12.5px;margin:3px 0}
.mb .track{background:#EEF1EF;border-radius:5px;height:10px;overflow:hidden}
.mb .fill{height:100%;background:#9DB5A6}
.mb .fill.lo{background:var(--red)}
.mb b{text-align:right;font-variant-numeric:tabular-nums}
.kv{font-size:13px;margin:3px 0}
.kv span{color:var(--muted)}
.kpi.btn{cursor:pointer;border:2px solid transparent;text-align:left;font:inherit}
.kpi.btn.on{border-color:var(--g)}
@media (max-width:820px){.dgrid{grid-template-columns:1fr}.sfil>*{flex:1 1 45%}.sfil input{width:auto}}
@media print{#p-students .sfil{display:none}}
</style>

<script>
const D=JSON.parse(document.getElementById('data').textContent);
const TABS=[['all','All Surveys'],['students','Students'],['overview','Overview'],['results','Results'],['areas','Areas of Interest'],['trends','Trends'],['follow','Follow-up'],['voice','Student Voice'],['actions','Actions'],['note','Data Note']];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=v=>v==null?'–':(Math.round(v*10)/10)+'%';
let S=D.surveys.find(x=>x.level==='full')||D.surveys[D.surveys.length-1];
function tabs(){ $('tabs').innerHTML=TABS.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join('');
 $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.k)); }
function show(k){ document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+k));
 $('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k)); try{localStorage.setItem('komodoTabNamed',k)}catch(e){} }
function kpi(v,l,cls=''){return `<div class="kpi ${cls}"><div class="v">${v}</div><div class="l">${l}</div></div>`}
function pill(c){return `<span class="pill ${c==='Complete'?'ok':(c==='Partial'||c==='Summary')?'part':'bad'}">${c==='Summary'?'Summary only':c}</span>`}
const summaryNote=()=>S.level==='summary'?`<div class="note" style="margin-bottom:12px"><b>Summary view.</b> Source: ${esc(S.source)}</div>`:'';
const respText=s=>s.responseText?`${s.response}% (${s.responseText})`:s.response+'%';

const SD=JSON.parse(document.getElementById('sdata').textContent);
const SV={};SD.surveys.forEach(x=>SV[x.id]=x);
const FL={urgent:'Urgent',watch:'Watch',drop:'Dropped 15+',rise:'Improved 15+',safety:'Safety 0%',request:'Asked for check-in',concern:'ACE answer concern'};
const FLT={urgent:'Overall wellbeing below 50% on their latest survey',watch:'Overall wellbeing 50–64% on their latest survey',drop:'Fell 15 or more points since their previous survey',rise:'Rose 15 or more points since their previous survey',safety:'Answered 0% on the safety question (Safety or Online safety)',request:'Asked for a check-in in Komodo',concern:'Gave the lowest answer on one or more ACE questions'};
const SEV=x=>x.flags.includes('urgent')?0:x.flags.includes('safety')?1:x.flags.includes('drop')?2:x.flags.includes('watch')?3:x.flags.includes('request')?4:x.flags.includes('concern')?5:9;
const isFlagged=x=>x.flags.some(f=>f!=='rise');
let SF={g:'all',sec:'all',f:'flagged',q:''},OPEN=null;
function trendHTML(x){return x.trend.map((p,i)=>{let a='';if(i>0&&p.v!=null&&x.trend[i-1].v!=null){const d=p.v-x.trend[i-1].v;a=`<span class="ar ${d<=-1?'dn':d>=1?'up':'eq'}" title="${d>0?'+':''}${d} points">${d<=-1?'▼':d>=1?'▲':'→'}</span>`;}return a+`<span class="pt"><small>${esc(SV[p.s].short)}</small>${p.v==null?'–':p.v+'%'}</span>`}).join('')}
function flagsHTML(x){return x.flags.map(f=>`<span class="fl ${f}" title="${esc(FLT[f])}">${FL[f]}</span>`).join('')}
function detailHTML(x){const L=SV[x.last];const M=Object.entries(x.m).filter(e=>e[1]!=null).sort((a,b)=>a[1]-b[1]);const lo=M.length?M[0][1]:null;
 return `<div class="dgrid"><div><h4>Latest answers · ${esc(L.label)}</h4>${M.map(([k,v])=>`<div class="mb"><span>${esc(k)}</span><div class="track"><div class="fill ${v<50?'lo':''}" style="width:${v}%"></div></div><b>${v}%</b></div>`).join('')}</div>
 <div><h4>This term</h4>${x.trend.map(p=>`<div class="kv"><span>${esc(SV[p.s].label)}:</span> <b>${p.v==null?'–':p.v+'%'}</b></div>`).join('')}
 ${x.req?`<div class="kv" style="margin-top:8px"><span>Check-in requests:</span> <b>${x.req}</b>${x.fu?' · followed up in Komodo':''}</div>`:''}
 ${x.concern.length?`<div class="kv"><span>Lowest ACE answers:</span> <b>${esc(x.concern.join(', '))}</b></div>`:''}
 <div class="kv" style="margin-top:8px"><span>Student ID:</span> ${x.id||'–'} · <span>Komodo ID:</span> ${x.kid||'–'}</div>
 <div class="kv"><span>Adviser:</span> ${esc(x.adv)} · <span>Gender:</span> ${x.sex==='F'?'Girl':'Boy'}${x.ace?' · <span>ACE student</span>':''}</div></div></div>`}
function srows(){const q=SF.q.trim().toLowerCase();
 return SD.students.filter(x=>(SF.g==='all'||String(x.g)===SF.g)&&(SF.sec==='all'||x.sec===SF.sec)&&(SF.f==='all'||(SF.f==='flagged'?isFlagged(x):x.flags.includes(SF.f)))&&(!q||x.n.toLowerCase().includes(q)||x.id.includes(q)||x.kid.includes(q)||x.sec.toLowerCase()===q))
  .sort((a,b)=>SEV(a)-SEV(b)||(a.score??999)-(b.score??999)||a.n.localeCompare(b.n));}
function drawStudents(){const L=srows();
 $('scount').textContent=`Showing ${L.length} student${L.length===1?'':'s'}`+('');
 $('stbody').innerHTML=L.map((x,i)=>{const k=x.sec+'|'+x.n;return `<tr class="srow" tabindex="0" data-k="${esc(k)}"><td><span class="sname">${esc(x.n)}</span>${x.ace?'<span class="ace">ACE</span>':''}<div class="sid">${x.id?'ID '+x.id:x.kid?'Komodo '+x.kid:''}</div></td><td><b>${x.sec}</b><div class="sid">${esc(x.adv)}</div></td><td><span class="sc ${x.score<50?'u':x.score<65?'w':''}">${x.score==null?'–':x.score+'%'}</span><div class="sid">${esc(SV[x.last].short)}</div></td><td>${flagsHTML(x)||'<span class="sid">–</span>'}</td><td class="low">${x.low.map(l=>esc(l[0])+' <b>'+l[1]+'%</b>').join('<br>')}</td><td class="tr">${trendHTML(x)}</td></tr>`+(OPEN===k?`<tr class="sdet"><td colspan="6">${detailHTML(x)}</td></tr>`:'')}).join('')||'<tr><td colspan="6" class="muted">No students match these filters.</td></tr>';
 document.querySelectorAll('#p-students .kpi.btn').forEach(b=>b.classList.toggle('on',b.dataset.f===SF.f));}
function secOpts(){const L=[...new Set(SD.students.filter(x=>SF.g==='all'||String(x.g)===SF.g).map(x=>x.sec))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
 $('ssec').innerHTML='<option value="all">All sections</option>'+L.map(c=>`<option ${c===SF.sec?'selected':''}>${c}</option>`).join('');}
function renderStudents(){const A=SD.students,F=A.filter(isFlagged),c=f=>A.filter(x=>x.flags.includes(f)).length;
 const kb=(f,v,l,cls)=>`<button type="button" class="kpi btn ${cls||''}" data-f="${f}"><div class="v">${v}</div><div class="l">${l}</div></button>`;
 $('p-students').innerHTML=`<h2>Students who need follow-up</h2>
 <div class="note"><b>Confidential.</b> This tab names students. Keep it within SLT and the Counselors. Each student is flagged on their <b>most recent</b> survey this term, using the October cut-offs (Urgent below 50%, Watch 50–64%). Cut-offs are prompts for a conversation, not diagnoses. Check CPOMS and PBIS notes before contacting a student or family.</div>
 <div class="grid k4" style="margin-top:12px">${kb('flagged',F.length,'students flagged (of '+A.length+')')}${kb('urgent',c('urgent'),'Urgent (below 50%)','red')}${kb('watch',c('watch'),'Watch (50–64%)','gold')}${kb('drop',c('drop'),'dropped 15+ points','red')}</div>
 <div class="grid k4" style="margin-top:12px">${kb('safety',c('safety'),'answered 0% on safety','red')}${kb('request',c('request'),'asked for a check-in')}${kb('concern',c('concern'),'ACE answer concerns')}${kb('rise',c('rise'),'improved 15+ points','')}</div>
 <div class="sfil"><select id="sgr" aria-label="Grade"><option value="all">All grades</option>${[...new Set(A.map(x=>x.g))].sort((a,b)=>a-b).map(g=>`<option value="${g}">Grade ${g}</option>`).join('')}</select>
 <select id="ssec" aria-label="Section"></select>
 <select id="sfl" aria-label="Flag"><option value="flagged">All flagged students</option>${Object.entries(FL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}<option value="all">Every student (flagged or not)</option></select>
 <input id="sq" type="search" placeholder="Search a name or student ID" aria-label="Search students"></div>
 <div class="scount" id="scount"></div>
 <div class="card" style="padding:0"><div class="tw"><table class="st"><thead><tr><th>Student</th><th>Section · Adviser</th><th>Latest</th><th>Flags</th><th>Lowest areas</th><th>Trend this term</th></tr></thead><tbody id="stbody"></tbody></table></div></div>
 <p class="small muted">Tap a student for all their latest answers. Trend arrows compare each survey with the one before; surveys ask different questions, so read changes as a direction. Grades 3–5 ACE students’ October score combines All About Me and the ACE Check-In (Komodo exports them together). Students are matched across surveys by name and grade.</p>`;
 secOpts();
 $('sgr').onchange=e=>{SF.g=e.target.value;SF.sec='all';secOpts();drawStudents()};
 $('ssec').onchange=e=>{SF.sec=e.target.value;drawStudents()};
 $('sfl').onchange=e=>{SF.f=e.target.value;drawStudents()};
 $('sq').oninput=e=>{SF.q=e.target.value;drawStudents()};
 document.querySelectorAll('#p-students .kpi.btn').forEach(b=>b.onclick=()=>{SF.f=b.dataset.f;$('sfl').value=SF.f;drawStudents()});
 $('stbody').onclick=e=>{const r=e.target.closest('tr.srow');if(!r)return;OPEN=OPEN===r.dataset.k?null:r.dataset.k;drawStudents()};
 $('stbody').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){const r=e.target.closest('tr.srow');if(r){e.preventDefault();OPEN=OPEN===r.dataset.k?null:r.dataset.k;drawStudents();}}};
 drawStudents();}

function renderAll(){
 const L=D.surveys;
 const g1012=['w3-2026-09','w4-2026-09'].map(id=>L.find(s=>s.id===id));

   $('secbars').innerHTML=bars(L);
   $('sectable').innerHTML=`<tr><th>Section</th><th>Overall</th><th>Respondents</th><th>Response rate</th><th>Change</th></tr>`+L.map(x=>`<tr class="${x.score===lowest?'low':''}"><td><b>${x.code}</b></td><td>${x.score}%</td><td>${x.n}</td><td>${x.resp}</td><td>Baseline</td></tr>`).join('');};

 } else {
  const gb=`<div class="bars">${S.grades.map(g=>`<div class="row" style="grid-template-columns:100px 1fr 54px"><b>${g.label||'Grade '+g.grade}</b><div class="track"><div class="fill ${g.tag==='Lowest'?'lowest':''}" style="width:${g.score}%"></div><div class="avg" style="left:${S.overall}%"></div></div><div class="val">${P(g.score)}</div></div>`).join('')}</div>`;

 }
 // areas
 if(full){
  const M=S.metricsAll, w=M.slice(0,3), s3=M.slice(-3).reverse();

 }
 // trends

 let tr;
 if(S.id==='w4-2026-09'||S.id==='w3-2026-09'){const a=D.surveys.find(s=>s.id==='w3-2026-09'),b=D.surveys.find(s=>s.id==='w4-2026-09');
  tr=`<div class="note">Grades 10–12 took part in both September surveys. The questions differed, so read changes as a direction.</div><div class="card" style="margin-top:12px"><table><tr><th>Grade</th><th>Week 3 (Sep)</th><th>Week 4 (30 Sep)</th><th>Direction</th></tr>${[10,11,12].map(gr=>{const x=a.grades.find(q=>q.grade===gr).score,y=b.grades.find(q=>q.grade===gr).score;return `<tr><td><b>Grade ${gr}</b></td><td>${P(x)}</td><td>${P(y)}</td><td>${y>x?'▲ Up':'▼ Down'}</td></tr>`}).join('')}</table><p class="small muted">Grades 6–9 have one survey so far; their next survey is Week 8 (21 Oct).</p></div>`;}
 else if(full){tr=`<div class="note">This is the first ${esc(S.cohort)} survey this year, so it is the baseline. Trends will build here as each new survey is added.</div>
  <div class="card" style="margin-top:12px"><div class="tw"><table><tr><th>Section</th>${same.map(x=>`<th>${x.date}</th>`).join('')}<th>Change</th></tr>${S.sections.map(x=>`<tr><td><b>${x.code}</b></td>${same.map(y=>{const z=(y.sections||[]).find(q=>q.code===x.code);return `<td>${z?z.score+'%':'No data'}</td>`}).join('')}<td>Baseline</td></tr>`).join('')}<tr><td><b>${esc(S.cohort)}</b></td>${same.map(y=>`<td><b>${y.overall}%</b></td>`).join('')}<td>Baseline</td></tr></table></div></div>`;}
 else tr=`<div class="note">This is the first ${esc(S.cohort)} check-in this year, so it is the baseline. ${S.cohort==='ACE students'?'If the monthly check-in is approved, the next one will appear here.':''}</div>`;

 // follow-up
 if(full){

  <div class="grid k4">${kpi(T.ug+' / '+T.ub,'Urgent: girls / boys (below 50%)','red')}${kpi(T.wg+' / '+T.wb,'Watch: girls / boys (50–64%)','gold')}${kpi(T.reqStudents,'Students who requested a check-in ('+T.reqN+' requests)')}${kpi(T.reqFU,'Requests marked followed up in Komodo')}</div>
  <div class="card" style="margin-top:12px"><h3>By grade</h3><div class="tw"><table><tr><th>Grade</th><th>Urgent (girls / boys)</th><th>Watch (girls / boys)</th><th>Requested check-ins (girls / boys)</th><th>Followed up</th></tr>${S.grades.map(g=>`<tr><td><b>Grade ${g.grade}</b></td><td>${g.ug} / ${g.ub}</td><td>${g.wg} / ${g.wb}</td><td>${g.reqg} / ${g.reqb}</td><td>${g.reqfu}</td></tr>`).join('')}<tr><td><b>All</b></td><td><b>${T.ug} / ${T.ub}</b></td><td><b>${T.wg} / ${T.wb}</b></td><td><b>${S.grades.reduce((a,g)=>a+g.reqg,0)} / ${S.grades.reduce((a,g)=>a+g.reqb,0)}</b></td><td><b>${T.reqFU}</b></td></tr></table></div>
  <p class="small muted">Lists are held by the Grades 3–5 Counselor, working with each section’s adviser and the Grades 3–5 Head of Department. A request alone does not make a student Urgent. Names are only in the confidential follow-up workbook.</p></div>`;
 } else $('p-follow').innerHTML=`<h2>Follow-up (counts only)</h2>${summaryNote()}<div class="card"><table>${S.follow.map(([a,b])=>`<tr><td>${esc(a)}</td><td><b>${esc(b)}</b></td></tr>`).join('')}</table><p class="small muted">${esc(S.followNote||'Names are only in the confidential follow-up workbook.')}</p></div>`;
 // voice
 const V=S.voice;
 if(V){$('p-voice').innerHTML=`<h2>Student voice</h2><div class="grid k4">${kpi(V.posts,'posts captured')}${kpi(V.comments,'student comments')}${kpi(V.compliments,'compliments to '+V.staff+' staff')}${kpi(V.safeguard,'safeguarding concerns')}</div>
  <div class="grid k2" style="margin-top:12px"><div class="card"><h3>“What did you enjoy most about the IPC Entry Point?”</h3><div class="tw"><table><tr><th>Answer</th><th>G3</th><th>G4</th><th>G5</th><th>Total</th></tr>${V.ipc.map(r=>`<tr><td>${r.choice}</td><td>${r.g3}</td><td>${r.g4}</td><td>${r.g5}</td><td><b>${r.g3+r.g4+r.g5}</b></td></tr>`).join('')}</table></div><p class="small muted">${V.ipcN} comments answered this question. Hands-on activities and group learning were equally popular.</p></div>

function search(q){
 q=q.trim().toUpperCase().replace(/\s+/g,''); const box=$('searchRes');
 if(!q){box.innerHTML='';return}
 q=q.replace(/^GRADE/,'GR').replace(/^G(?=\d)/,'GR');const code=q.startsWith('GR')?q:'GR'+q;
 const hits=[];
 D.surveys.forEach(s=>(s.sections||[]).forEach(x=>{if(x.code.includes(code))hits.push([s,x])}));
 const gm=code.match(/^GR(\d+)$/), ghits=[];
 if(gm) D.surveys.forEach(s=>(s.grades||[]).forEach(g=>{if(String(g.grade)===gm[1])ghits.push([s,g])}));
 let h='';
 h+=ghits.map(([s,g])=>`<div class="card" style="margin-bottom:8px"><h3>Grade ${g.grade} · ${P(g.score)} <span class="muted small">· ${esc(s.short)}</span></h3>${g.low?`<div>Weakest: ${g.low.map(x=>`<span class="chip">${x[0]} ${x[1]}%</span>`).join('')}</div><div class="small">Urgent ${g.ug+g.ub} · Watch ${g.wg+g.wb} · Requested check-ins ${g.reqg+g.reqb}</div>`:''}</div>`).join('');
 h+=hits.map(([s,x])=>`<div class="card" style="margin-bottom:8px"><h3>${x.code} · ${x.score==null?'–':x.score+'%'} <span class="muted small">· ${esc(s.short)}</span></h3>${x.low?`<div>Weakest: ${x.low.map(y=>`<span class="chip">${y[0]} ${y[1]}%</span>`).join('')}</div><div>Strongest: ${x.high.map(y=>`<span class="chip">${y[0]} ${y[1]}%</span>`).join('')}</div><div class="small">Respondents ${x.n} · Response rate ${x.resp} · Urgent ${x.ug+x.ub} · Watch ${x.wg+x.wb} · Requested check-ins ${x.req}</div>`:`<div class="small">${esc(x.note||'Named in the summary report.')}</div>`}</div>`).join('');
 box.innerHTML=h||'<div class="card muted">No results for that section in the surveys so far. Sections with full detail: GR3A–GR5L. September surveys are summary only.</div>';
}
$('picker').innerHTML=D.surveys.map((x,i)=>`<option value="${i}" ${x===S?'selected':''}>${esc(x.label)}</option>`).join('');

tabs();renderAll();renderStudents();render();
let start='all';try{start=localStorage.getItem('komodoTabNamed')||'all'}catch(e){}
show(TABS.some(t=>t[0]===start)?start:'all');
</script>
